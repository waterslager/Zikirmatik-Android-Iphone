<script>
  const MAX_COUNT = 999999;
  const TARGET = 100;

  let counter = 0;
  let toastTimeout = null;

  const display = document.getElementById('display');
  const digitElements = [];

  for (let i = 0; i < 6; i++) {
    const digit = document.createElement('div');
    digit.className = 'lcd-digit ghost';
    digit.textContent = '0';
    display.appendChild(digit);
    digitElements.push(digit);
  }

  try {
    const saved = localStorage.getItem('zikirmatikCount');
    if (saved !== null && !isNaN(parseInt(saved))) {
      counter = Math.min(MAX_COUNT, Math.max(0, parseInt(saved)));
    }
  } catch (e) {
    console.warn('localStorage okunamadı:', e);
    counter = 0;
  }

  function updateDisplay() {
    const digitsStr = String(counter);
    const padCount = Math.max(0, 6 - digitsStr.length);
    const full = '0'.repeat(padCount) + digitsStr;
    for (let i = 0; i < 6; i++) {
      const el = digitElements[i];
      el.textContent = full[i];
      if (i < padCount) {
        el.classList.add('ghost');
      } else {
        el.classList.remove('ghost');
      }
    }
  }
